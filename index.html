      }

    const INITIAL_RESULTS = {
      "STU-1001_2025-2026_Final Exam": {
        English: 82, Urdu: 85, Mathematics: 90, Physics: 88, Chemistry: 85, "Computer Science": 94, Islamiyat: 91,
        remarks: "Excellent overall performance in Class 10! Hardworking student."
      },
      "STU-1001_2024-2025_Final Exam": {

        remarks: "Outstanding achievement! Class Topper in Class 10."
      },
      "STU-1003_2025-2026_Final Exam": {
        English: 65, Urdu: 70, Mathematics: 58, Science: 62, "Computer Science": 75, Islamiyat: 80,
        remarks: "Satisfactory performance. Needs more focus on Math & Science."

      "STU-1004_2025-2026_Final Exam": {

    };

    // ============== HELPERS ==============
    function Icon({ name, className = "w-4 h-4" }) {
      const ref = useRef(null);
      useEffect(() => {
        if (ref.current && window.lucide) {
          ref.current.innerHTML = '';
          const i = document.createElement('i');
          i.setAttribute('data-lucide', name);
          i.className = className;
          ref.current.appendChild(i);
          window.lucide.createIcons({ nodes: [i] });
        }
      }, [name, className]);
      return <span ref={ref} className="inline-flex" />;
    }

    // ============== MAIN APP ==============
    function App() {
      const [role, setRole] = useState('parent');
      const [activeTab, setActiveTab] = useState('parent-portal');
      const [schoolInfo, setSchoolInfo] = useState(DEFAULT_SCHOOL_INFO);
      const [currentAcademicYear, setCurrentAcademicYear] = useState('2025-2026');
      const [academicYears, setAcademicYears] = useState(DEFAULT_ACADEMIC_YEARS);
      const [classList, setClassList] = useState(DEFAULT_CLASSES);
      const [subjectsConfig, setSubjectsConfig] = useState(DEFAULT_SUBJECTS_CONFIG);
      const [students, setStudents] = useState(INITIAL_STUDENTS);
      const [results, setResults] = useState(INITIAL_RESULTS);
      const [toast, setToast] = useState(null);

      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3500);
      };

      const getSubjectsForClass = (className) => {
        return subjectsConfig[className] || subjectsConfig['Default'] || ["English", "Urdu", "Mathematics", "General Science", "Islamiyat"];
      };

      const calculateGrade = (percentage) => {
        const p = Number(percentage);
        if (p >= 80) return { grade: 'A+', color: 'text-emerald-600', badge: 'bg-emerald-100 text-emerald-800' };
        if (p >= 70) return { grade: 'A', color: 'text-teal-600', badge: 'bg-teal-100 text-teal-800' };
        if (p >= 60) return { grade: 'B', color: 'text-blue-600', badge: 'bg-blue-100 text-blue-800' };
        if (p >= 50) return { grade: 'C', color: 'text-amber-600', badge: 'bg-amber-100 text-amber-800' };
        if (p >= 40) return { grade: 'D', color: 'text-orange-600', badge: 'bg-orange-100 text-orange-800' };
        return { grade: 'F', color: 'text-rose-600', badge: 'bg-rose-100 text-rose-800' };
      };

      const calculateClassRank = (studentId, className, year = currentAcademicYear, term = 'Final Exam') => {
        const classStudents = students.filter(s => s.className === className && s.status !== 'Graduated');
        const classSubjects = getSubjectsForClass(className);
        const rankings = classStudents.map(student => {
          const res = results[`${student.id}_${year}_${term}`];
          let totalObtained = 0;
          if (res) classSubjects.forEach(sub => { if (res[sub] !== undefined) totalObtained += Number(res[sub]); });
          return { id: student.id, totalObtained };
        });
        rankings.sort((a, b) => b.totalObtained - a.totalObtained);
        const index = rankings.findIndex(r => r.id === studentId);
        if (index === -1) return { rank: 'N/A', totalClass: classStudents.length };
        return { rank: index + 1, totalClass: classStudents.length };
      };

      const handleExportData = () => {
        const backupData = {
          version: 3, exportDate: new Date().toISOString(),
          currentAcademicYear, academicYears, classList, subjectsConfig, students, results
        };
        const blob = new Blob([JSON.stringify(backupData, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `School_Portal_Backup_${currentAcademicYear}_${new Date().toISOString().slice(0, 10)}.json`;
        a.click();
        showToast('School database backup downloaded successfully!');
      };

      const handleImportData = (event) => {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const imported = JSON.parse(e.target.result);
            if (imported.students && imported.results) {
              if (imported.currentAcademicYear) setCurrentAcademicYear(imported.currentAcademicYear);
              if (imported.academicYears) setAcademicYears(imported.academicYears);
              if (imported.classList) setClassList(imported.classList);
              if (imported.subjectsConfig) setSubjectsConfig(imported.subjectsConfig);
              setStudents(imported.students);
              setResults(imported.results);
              showToast('School system restored successfully!');
            } else showToast('Invalid backup file format.', 'error');
          } catch (err) {
            showToast('Error parsing backup file.', 'error');
          }
        };
        reader.readAsText(file);
      };

      const handleResetDemo = () => {
        if (window.confirm('Reset all portal data back to initial demo state?')) {
          setCurrentAcademicYear('2025-2026');
          setAcademicYears(DEFAULT_ACADEMIC_YEARS);
          setClassList(DEFAULT_CLASSES);
          setSubjectsConfig(DEFAULT_SUBJECTS_CONFIG);
          setStudents(INITIAL_STUDENTS);
          setResults(INITIAL_RESULTS);
          showToast('Portal reset to default demo data.');
        }
      };

      return (
        <div className="min-h-screen bg-slate-50 text-slate-800 flex flex-col">
          {/* Toast */}
          {toast && (
            <div className={`fixed top-4 right-4 z-50 px-5 py-3 rounded-xl shadow-lg text-sm font-semibold text-white ${
              toast.type === 'error' ? 'bg-rose-600' : 'bg-emerald-600'
            }`}>
              {toast.message}
            </div>
          )}

          {/* Header */}
          <header className="bg-slate-900 text-white shadow-lg sticky top-0 z-40 print:hidden">

              <div className="flex items-center space-x-3">
                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-500 to-teal-400 flex items-center justify-center font-bold text-xl shadow-md">
                  AT
                </div>
                <div>
                  <div className="flex items-center space-x-2">
                    <h1 className="font-extrabold text-lg tracking-tight">{schoolInfo.name}</h1>

                      {schoolInfo.urduName}
                    </span>
                  </div>
                  <p className="text-xs text-slate-400 hidden sm:block">{schoolInfo.tagline}</p>
                </div>
              </div>

              <div className="flex items-center gap-2 text-xs">
                <div className="hidden lg:block text-right border-r border-slate-700 pr-4">
                  <span className="block text-slate-400 text-[10px] uppercase">Patron & Founder</span>
                  <span className="font-semibold text-emerald-400">{schoolInfo.ownerName}</span>
                </div>
                <div className="hidden md:block text-right">
                  <span className="block text-slate-400 text-[10px] uppercase">Academic Session</span>
                  <span className="font-semibold text-slate-200">{currentAcademicYear}</span>
                </div>
              </div>
            </div>

            {/* Role Switcher */}
            <div className="bg-slate-800/80 border-t border-slate-700/50">
              <div className="max-w-7xl mx-auto px-4 py-2 flex flex-wrap items-center gap-2">
                <span className="text-[10px] text-slate-400 uppercase font-semibold mr-1">Role:</span>
                <button onClick={() => { setRole('parent'); setActiveTab('parent-portal'); }}
                  className={`px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition-all ${
                    role === 'parent' ? 'bg-teal-500 text-slate-950' : 'text-slate-300 hover:text-white'
                  }`}>
                  Parent Portal (والدین)
                </button>
                <button onClick={() => { setRole('teacher'); setActiveTab('upload'); }}
                  className={`px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition-all ${
                    role === 'teacher' ? 'bg-teal-500 text-slate-950' : 'text-slate-300 hover:text-white'
                  }`}>
                  Teacher
                </button>
                <button onClick={() => { setRole('admin'); setActiveTab('promotion'); }}
                  className={`px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition-all ${
                    role === 'admin' ? 'bg-teal-500 text-slate-950' : 'text-slate-300 hover:text-white'
                  }`}>
                  Admin
                </button>
              </div>
            </div>

            {/* Nav Tabs */}
            <nav className="bg-slate-800 border-t border-slate-700/50">
              <div className="max-w-7xl mx-auto px-4 flex space-x-1 overflow-x-auto">
                <TabBtn active={activeTab === 'parent-portal'} onClick={() => setActiveTab('parent-portal')} label="Parent Portal (والدین کا پورٹل)" />
                {(role === 'admin' || role === 'teacher') && (
                  <TabBtn active={activeTab === 'promotion'} onClick={() => setActiveTab('promotion')} label="Batch Promotion (پروموشن)" />
                )}
                {(role === 'admin' || role === 'teacher') && (
                  <TabBtn active={activeTab === 'upload'} onClick={() => setActiveTab('upload')} label="Teacher Portal (Marks Entry)" />
                )}
                <TabBtn active={activeTab === 'results'} onClick={() => setActiveTab('results')} label="Official Report Card Print" />
                {role === 'admin' && (
                  <TabBtn active={activeTab === 'settings'} onClick={() => setActiveTab('settings')} label="Settings & Backup" />
                )}
                {role === 'admin' && (
                  <TabBtn active={activeTab === 'register'} onClick={() => setActiveTab('register')} label="Student Registration" />
                )}
                {role === 'admin' && (
                  <TabBtn active={activeTab === 'dashboard'} onClick={() => setActiveTab('dashboard')} label="Dashboard" />
                )}
              </div>
            </nav>
          </header>

          {/* Main Content */}
          <main className="flex-grow max-w-7xl w-full mx-auto px-4 py-6">
            {activeTab === 'parent-portal' && (
              <ParentPortalView
                students={students} results={results} classList={classList}
                academicYears={academicYears} currentAcademicYear={currentAcademicYear}
                getSubjectsForClass={getSubjectsForClass} calculateGrade={calculateGrade}
                calculateClassRank={calculateClassRank} schoolInfo={schoolInfo}
              />
            )}
            {activeTab === 'promotion' && (
              <BatchPromotionView
                students={students} setStudents={setStudents} results={results}
                classList={classList} academicYears={academicYears}
                currentAcademicYear={currentAcademicYear} setCurrentAcademicYear={setCurrentAcademicYear}
                getSubjectsForClass={getSubjectsForClass} showToast={showToast}
              />
            )}
            {activeTab === 'dashboard' && (
              <DashboardView
                students={students} results={results} classList={classList}
                currentAcademicYear={currentAcademicYear} setActiveTab={setActiveTab}
              />
            )}
            {activeTab === 'register' && (
              <StudentRegistrationView
                students={students} setStudents={setStudents} classList={classList} showToast={showToast}
              />
            )}
            {activeTab === 'upload' && (
              <TeacherResultUploadView
                students={students} results={results} setResults={setResults}
                classList={classList} currentAcademicYear={currentAcademicYear}
                academicYears={academicYears} getSubjectsForClass={getSubjectsForClass}
                showToast={showToast} calculateGrade={calculateGrade}
              />
            )}
            {activeTab === 'results' && (
              <ResultLookupPrintView
                students={students} results={results} academicYears={academicYears}
                currentAcademicYear={currentAcademicYear} getSubjectsForClass={getSubjectsForClass}
                calculateGrade={calculateGrade} calculateClassRank={calculateClassRank}
                schoolInfo={schoolInfo}
              />
            )}
            {activeTab === 'settings' && (
              <SystemSettingsView
                currentAcademicYear={currentAcademicYear} setCurrentAcademicYear={setCurrentAcademicYear}
                academicYears={academicYears} setAcademicYears={setAcademicYears}
                classList={classList} setClassList={setClassList}
                subjectsConfig={subjectsConfig} setSubjectsConfig={setSubjectsConfig}
                handleExportData={handleExportData} handleImportData={handleImportData}
                handleResetDemo={handleResetDemo} showToast={showToast}
              />
            )}
          </main>

          {/* Footer */}
          <footer className="print:hidden bg-slate-900 text-slate-400 border-t border-slate-800 py-5 mt-auto">
            <div className="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row justify-between items-center gap-3 text-xs">
              <div className="text-center sm:text-left">
                <p className="font-semibold text-slate-200">{schoolInfo.name} ({schoolInfo.urduName})</p>
                <p className="mt-0.5">Founder & Patron-in-Chief: <span className="text-emerald-400 font-medium">{schoolInfo.ownerName}</span></p>
                <p className="text-slate-500 text-[11px] mt-1">{schoolInfo.address}</p>
              </div>
              <div className="text-center sm:text-right">
                <div className="inline-flex items-center gap-1.5 bg-slate-800/80 px-3 py-1.5 rounded-lg border border-slate-700 text-slate-300">
                  Designed & Developed by <strong className="text-teal-300">{schoolInfo.developerName}</strong>
                </div>
                <p className="text-slate-500 text-[11px] mt-1">Powered by Al Tahir Software Solutions • All Rights Reserved</p>
              </div>
            </div>
          </footer>
        </div>
      );
    }

    function TabBtn({ active, onClick, label }) {
      return (
        <button onClick={onClick}
          className={`py-3 px-3.5 text-xs sm:text-sm font-medium border-b-2 whitespace-nowrap transition-colors ${
            active ? 'border-teal-400 text-teal-400 font-semibold' : 'border-transparent text-slate-300 hover:text-white'
          }`}>
          {label}
        </button>
      );
    }

    // ============== PARENT PORTAL ==============
    function ParentPortalView({ students, results, academicYears, currentAcademicYear, getSubjectsForClass, calculateGrade, calculateClassRank, schoolInfo }) {
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedYear, setSelectedYear] = useState(currentAcademicYear);
      const [selectedTerm, setSelectedTerm] = useState('Final Exam');
      const [selectedStudent, setSelectedStudent] = useState(null);

      const matchedStudents = students.filter(student => {
        const q = searchQuery.trim().toLowerCase();
        if (!q) return false;
        return student.name.toLowerCase().includes(q) ||
               student.fatherName.toLowerCase().includes(q) ||
               student.rollNo.toString().toLowerCase().includes(q);
      });

      useEffect(() => {
        if (matchedStudents.length === 1) setSelectedStudent(matchedStudents[0]);
        else if (searchQuery.trim() === '' && !selectedStudent) setSelectedStudent(students[0] || null);
      }, [searchQuery]);

      const getStudentClassForYear = (student, targetYear) => {
        if (!student) return '';
        if (targetYear === currentAcademicYear) return student.className;
        const historyItem = (student.academicHistory || []).find(h => h.academicYear === targetYear);
        return historyItem ? historyItem.className : student.className;
      };

      const studentClassInSelectedYear = selectedStudent ? getStudentClassForYear(selectedStudent, selectedYear) : '';
      const currentClassSubjects = getSubjectsForClass(studentClassInSelectedYear);
      const studentResultKey = selectedStudent ? `${selectedStudent.id}_${selectedYear}_${selectedTerm}` : '';
      const currentResult = selectedStudent ? results[studentResultKey] : null;

      let totalObtained = 0;
      const totalPossible = currentClassSubjects.length * 100;
      if (currentResult) {
        currentClassSubjects.forEach(sub => {
          if (currentResult[sub] !== undefined) totalObtained += Number(currentResult[sub]);
        });
      }
      const overallPercentage = totalPossible > 0 ? ((totalObtained / totalPossible) * 100).toFixed(1) : 0;
      const overallGrade = calculateGrade(overallPercentage);
      const rankInfo = selectedStudent
        ? calculateClassRank(selectedStudent.id, studentClassInSelectedYear, selectedYear, selectedTerm)
        : { rank: 'N/A', totalClass: 0 };

      return (
        <div className="space-y-6">
          <div className="print:hidden bg-gradient-to-r from-teal-900 via-slate-900 to-indigo-950 text-white rounded-3xl p-6 sm:p-8 shadow-xl">
            <div className="flex flex-col md:flex-row items-start md:items-center justify-between gap-6">
              <div className="max-w-2xl">
                <span className="bg-teal-500/20 text-teal-300 text-xs font-semibold px-3 py-1 rounded-full uppercase tracking-wider">
                  Parents Result Portal - والدین کا پورٹل
                </span>
                <h2 className="text-2xl sm:text-3xl font-black mt-3 tracking-tight">Aap ke Bacha Ka Dynamic Result Search</h2>
                <p className="text-slate-300 text-xs sm:text-sm mt-2 leading-relaxed">
                  Find student results across current and previous academic years using Student Name, Father Name, or Roll Number.
                </p>
              </div>
              <div className="bg-white/10 backdrop-blur-md p-4 rounded-2xl border border-white/10 text-center">
                <p className="text-xs text-slate-300 font-medium">Selected Session</p>
                <p className="text-xl font-bold text-teal-300 mt-1">{selectedYear}</p>
              </div>
            </div>
          </div>

          <div className="print:hidden bg-white p-5 sm:p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
            <h3 className="font-bold text-slate-800 text-base">Search Student / Bacha Search Karein</h3>
            <div className="grid grid-cols-1 sm:grid-cols-12 gap-3">
              <div className="sm:col-span-6">
                <input type="text" placeholder="Search by Student Name, Father's Name, or Roll No..."
                  value={searchQuery} onChange={e => setSearchQuery(e.target.value)}
                  className="w-full px-4 py-2.5 text-sm rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-teal-500/30 focus:border-teal-500" />
              </div>
              <div className="sm:col-span-3">
                <select value={selectedYear} onChange={e => setSelectedYear(e.target.value)}
                  className="w-full px-3.5 py-2.5 text-sm rounded-xl border border-slate-200 bg-white font-semibold">
                  {academicYears.map(y => <option key={y} value={y}>Session {y}</option>)}
                </select>
              </div>
              <div className="sm:col-span-3">
                <select value={selectedTerm} onChange={e => setSelectedTerm(e.target.value)}
                  className="w-full px-3.5 py-2.5 text-sm rounded-xl border border-slate-200 bg-white">
                  {DEFAULT_TERMS.map(t => <option key={t} value={t}>{t}</option>)}
                </select>
              </div>
            </div>
            <div className="pt-1 flex flex-wrap items-center gap-2 text-xs">
              <span className="text-slate-400 font-medium">Quick Search:</span>

                    </button>
                  ))}
                </div>
              </div>
            )}

          {selectedStudent ? (
            <div className="space-y-6">
              <div className="print:hidden bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
                <div className="flex items-center gap-4">
                  <div className="w-14 h-14 bg-gradient-to-tr from-slate-800 to-slate-900 text-white font-black text-xl rounded-2xl flex items-center justify-center shadow">
                    {selectedStudent.name.charAt(0)}
                  </div>
                  <div>
                    <div className="flex items-center gap-2 flex-wrap">
                      <h3 className="text-xl font-bold text-slate-900">{selectedStudent.name}</h3>
                      <span className="bg-slate-100 text-slate-700 font-semibold text-xs px-2.5 py-0.5 rounded-md">Roll #{selectedStudent.rollNo}</span>
                      {selectedStudent.status === 'Graduated' && (
                        <span className="bg-amber-100 text-amber-800 text-xs font-bold px-2 py-0.5 rounded-md">Graduated Alumni</span>
                      )}
                    </div>
                    <p className="text-xs text-slate-500 mt-1">
                      Father: <strong className="text-slate-700">{selectedStudent.fatherName}</strong> | {studentClassInSelectedYear} ({selectedStudent.section})
                    </p>
                  </div>
                </div>
                <button onClick={() => window.print()}
                  className="w-full md:w-auto bg-slate-900 hover:bg-slate-800 text-white font-semibold px-5 py-2.5 rounded-xl text-sm flex items-center justify-center gap-2 shadow">
                  Print Official Report Card
                </button>
              </div>

              {/* Metrics */}
              <div className="print:hidden grid grid-cols-2 sm:grid-cols-4 gap-4">
                <MetricCard label="Total Marks" value={currentResult ? `${totalObtained}` : '0'} sub={`/ ${totalPossible} • ${overallPercentage}%`} />
                <MetricCard label="Overall Grade" value={currentResult ? overallGrade.grade : 'N/A'} color={overallGrade.color}
                  sub={Number(overallPercentage) >= 40 ? 'Status: Passed' : 'Status: Needs Improvement'} />
                <MetricCard label="Class Rank" value={`#${rankInfo.rank}`} sub={`out of ${rankInfo.totalClass}`} />
                <MetricCard label="Attendance" value={selectedStudent.attendance || '95%'} color="text-emerald-600" sub="Regular Attendance" />
              </div>

              {/* Printable Card */}
              <div className="bg-white rounded-2xl border border-slate-300 p-6 sm:p-10 shadow-lg print:shadow-none print:border-2 print:border-emerald-800 print-card">
                <div className="border-b-2 border-slate-900 pb-6 mb-6 flex flex-col sm:flex-row items-center justify-between text-center sm:text-left gap-4">
                  <div>
                    <h2 className="text-2xl font-black uppercase text-slate-900 tracking-wide">{schoolInfo.name}</h2>
                    <p className="text-sm font-urdu text-emerald-800 font-bold">{schoolInfo.urduName}</p>
                    <p className="text-xs font-semibold text-slate-600 uppercase tracking-wider mt-1">Official Student Progress & Examination Report Card</p>
                    <p className="text-xs text-slate-400 mt-0.5">Session {selectedYear} • Founder: {schoolInfo.ownerName}</p>
                  </div>
                  <div className="inline-block bg-teal-50 border border-teal-200 text-teal-800 font-bold px-3 py-1 rounded-lg text-xs uppercase tracking-wider">
                    {selectedTerm}
                  </div>
                </div>

                <div className="bg-slate-50 border border-slate-200 rounded-xl p-4 mb-6 grid grid-cols-2 sm:grid-cols-4 gap-4 text-sm">
                  <div><span className="text-slate-400 block text-[11px] uppercase">Student Name</span><span className="font-bold">{selectedStudent.name}</span></div>
                  <div><span className="text-slate-400 block text-[11px] uppercase">Roll Number</span><span className="font-bold">#{selectedStudent.rollNo}</span></div>
                  <div><span className="text-slate-400 block text-[11px] uppercase">Class & Section</span><span className="font-bold">{studentClassInSelectedYear} ({selectedStudent.section})</span></div>
                  <div><span className="text-slate-400 block text-[11px] uppercase">Father's Name</span><span className="font-bold">{selectedStudent.fatherName}</span></div>
                </div>

                {currentResult ? (
                  <div className="space-y-6">
                    <table className="w-full border-collapse text-left text-sm">
                      <thead>
                        <tr className="bg-slate-900 text-white font-semibold">
                          <th className="p-3 rounded-tl-lg">Subject</th>
                          <th className="p-3 text-center">Max Marks</th>
                          <th className="p-3 text-center">Marks Obtained</th>
                          <th className="p-3 text-center">Grade</th>
                          <th className="p-3 text-center rounded-tr-lg">Status</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-200">
                        {currentClassSubjects.map((subject, idx) => {
                          const marks = currentResult[subject] !== undefined ? currentResult[subject] : '-';
                          const perc = currentResult[subject] !== undefined ? currentResult[subject] : 0;
                          const g = calculateGrade(perc);
                          const pass = perc >= 40;
                          return (
                            <tr key={subject} className={idx % 2 === 0 ? 'bg-white' : 'bg-slate-50/50'}>
                              <td className="p-3 font-semibold">{subject}</td>
                              <td className="p-3 text-center text-slate-500">100</td>
                              <td className="p-3 text-center font-bold">{marks}</td>
                              <td className="p-3 text-center"><span className={`font-bold ${g.color}`}>{g.grade}</span></td>
                              <td className="p-3 text-center">
                                <span className={`px-2.5 py-0.5 rounded text-[10px] font-bold ${pass ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}`}>
                                  {pass ? 'PASS' : 'FAIL'}
                                </span>
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 border border-slate-200 p-4 rounded-xl bg-slate-50 text-sm">
                      <div><span className="text-slate-400 block text-[11px] uppercase">Grand Total</span><span className="font-bold">{totalObtained} / {totalPossible}</span></div>
                      <div><span className="text-slate-400 block text-[11px] uppercase">Percentage</span><span className="font-bold">{overallPercentage}%</span></div>
                      <div><span className="text-slate-400 block text-[11px] uppercase">Class Position</span><span className="font-bold">Rank #{rankInfo.rank}</span></div>
                      <div><span className="text-slate-400 block text-[11px] uppercase">Final Grade</span>
                        <span className={`font-bold ${overallGrade.color}`}>{overallGrade.grade} ({Number(overallPercentage) >= 40 ? 'PASSED' : 'FAILED'})</span>
                      </div>
                    </div>
                    <div className="p-4 border border-slate-200 rounded-xl">
                      <span className="text-xs font-bold text-slate-800 uppercase block">Class Teacher Feedback:</span>

                    </div>
                    <div className="pt-10 grid grid-cols-3 gap-4 text-center text-xs text-slate-500 font-medium">
                      <div className="border-t border-slate-400 pt-2">Class Teacher Signature</div>
                      <div className="border-t border-slate-400 pt-2">Exam Controller</div>
                      <div className="border-t border-slate-400 pt-2">Principal Stamp & Signature</div>
                    </div>
                    <div className="mt-4 pt-2 border-t border-slate-200 text-center text-[10px] text-slate-400 flex justify-between">
                      <span>Verified Computer Generated Result • {schoolInfo.name}</span>
                      <span>Software by: <strong>{schoolInfo.developerName}</strong></span>
                    </div>
                  </div>
                ) : (
                  <div className="p-8 text-center bg-amber-50 border border-amber-200 rounded-xl text-amber-800 text-sm">
                    Result for <strong>{selectedTerm} ({selectedYear})</strong> has not been uploaded yet for this student.
                  </div>
                )}
              </div>
            </div>
          ) : (
            <div className="bg-white p-12 text-center rounded-2xl border border-slate-200 max-w-xl mx-auto text-slate-400">
              <p className="font-semibold text-slate-600">No Student Selected — Search by name, father name or roll number</p>
            </div>
          )}
        </div>
      );
    }

    function MetricCard({ label, value, sub, color = 'text-slate-900' }) {
      return (
        <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
          <span className="text-xs text-slate-400 font-medium block">{label}</span>
          <p className={`text-xl font-extrabold mt-1 ${color}`}>{value}</p>
          {sub && <span className="text-[11px] text-slate-500 font-medium">{sub}</span>}
        </div>
      );
    }

    // ============== BATCH PROMOTION ==============
    function BatchPromotionView({ students, setStudents, results, classList, academicYears, currentAcademicYear, setCurrentAcademicYear, getSubjectsForClass, showToast }) {
      const [sourceClass, setSourceClass] = useState('Class 9');
      const [sourceSection, setSourceSection] = useState('A');
      const [targetClass, setTargetClass] = useState('Class 10');
      const [targetSection, setTargetSection] = useState('A');
      const [targetYear, setTargetYear] = useState('2026-2027');
      const [passThreshold] = useState(40);
      const [selectedStudentIds, setSelectedStudentIds] = useState([]);
      const [isGraduationMode, setIsGraduationMode] = useState(false);

      const sourceStudents = students.filter(s => s.className === sourceClass && s.section === sourceSection && s.status !== 'Graduated');

      useEffect(() => {
        const isFinal = sourceClass === classList[classList.length - 1];
        setIsGraduationMode(isFinal);
        const currIdx = classList.indexOf(sourceClass);
        if (currIdx !== -1 && currIdx < classList.length - 1) setTargetClass(classList[currIdx + 1]);
      }, [sourceClass, classList]);

      useEffect(() => {
        setSelectedStudentIds(sourceStudents.map(s => s.id));
      }, [sourceClass, sourceSection]);

      const toggleSelectStudent = (id) => {
        setSelectedStudentIds(prev => prev.includes(id) ? prev.filter(i => i !== id) : [...prev, id]);
      };

      const toggleSelectAll = () => {
        if (selectedStudentIds.length === sourceStudents.length) setSelectedStudentIds([]);
        else setSelectedStudentIds(sourceStudents.map(s => s.id));
      };

      const getStudentPerformance = (studentId) => {
        const res = results[`${studentId}_${currentAcademicYear}_Final Exam`];
        if (!res) return { percentage: 0, status: 'No Exam Data', pass: false };
        const classSubjects = getSubjectsForClass(sourceClass);
        let totalObtained = 0;
        classSubjects.forEach(sub => { if (res[sub] !== undefined) totalObtained += Number(res[sub]); });
        const percentage = classSubjects.length > 0 ? (totalObtained / (classSubjects.length * 100)) * 100 : 0;
        const pass = percentage >= passThreshold;
        return { percentage: percentage.toFixed(1), status: pass ? 'Passed' : 'Failed', pass };
      };

      const handleExecutePromotion = () => {
        if (selectedStudentIds.length === 0) {
          showToast('Please select at least one student!', 'error');
          return;
        }
        const updated = students.map(student => {
          if (!selectedStudentIds.includes(student.id)) return student;
          const historyEntry = { academicYear: currentAcademicYear, className: student.className, section: student.section, rollNo: student.rollNo };
          const existingHistory = student.academicHistory || [];
          if (isGraduationMode) {
            return { ...student, status: 'Graduated', academicHistory: [...existingHistory, historyEntry] };
          }
          return { ...student, className: targetClass, section: targetSection, academicHistory: [...existingHistory, historyEntry] };
        });
        setStudents(updated);
        if (targetYear !== currentAcademicYear) setCurrentAcademicYear(targetYear);
        showToast(isGraduationMode
          ? `${selectedStudentIds.length} students marked as Graduated Alumni!`
          : `${selectedStudentIds.length} students promoted to ${targetClass} (${targetSection}) for ${targetYear}!`);
      };

      return (
        <div className="space-y-6">
          <div className="bg-gradient-to-r from-amber-900 via-slate-900 to-indigo-950 text-white rounded-3xl p-6 sm:p-8 shadow-xl">
            <span className="bg-amber-500/20 text-amber-300 text-xs font-semibold px-3 py-1 rounded-full uppercase">Automated Class Batch Promotion System</span>
            <h2 className="text-2xl sm:text-3xl font-black mt-3">یک کلک پر کلاس پروموشن (Batch Promotion)</h2>
            <p className="text-slate-300 text-sm mt-2 max-w-2xl">Promote an entire class of students to the next grade with a single click while archiving their past exam marksheets.</p>
          </div>

          <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-6">
            <h3 className="font-bold text-slate-800 border-b border-slate-100 pb-3">Promotion Parameters</h3>
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4">
              <div>
                <label className="block text-xs font-bold text-slate-600 mb-1">Source Class</label>
                <select value={sourceClass} onChange={e => setSourceClass(e.target.value)} className="w-full px-3.5 py-2 text-sm rounded-xl border border-slate-200 bg-white">
                  {classList.map(c => <option key={c} value={c}>{c}</option>)}
                </select>
              </div>
              <div>
                <label className="block text-xs font-bold text-slate-600 mb-1">Section</label>
                <select value={sourceSection} onChange={e => setSourceSection(e.target.value)} className="w-full px-3.5 py-2 text-sm rounded-xl border border-slate-200 bg-white">
                  {DEFAULT_SECTIONS.map(s => <option key={s} value={s}>Section {s}</option>)}
                </select>
              </div>
              <div>
                <label className="block text-xs font-bold text-slate-600 mb-1">{isGraduationMode ? 'Action' : 'Promote To'}</label>
                {isGraduationMode ? (
                  <div className="px-3.5 py-2 text-xs font-bold text-amber-800 bg-amber-50 border border-amber-200 rounded-xl">Graduate Students</div>
                ) : (
                  <select value={targetClass} onChange={e => setTargetClass(e.target.value)} className="w-full px-3.5 py-2 text-sm rounded-xl border border-slate-200 bg-white font-semibold text-teal-700">
                    {classList.map(c => <option key={c} value={c}>{c}</option>)}
                  </select>
                )}
              </div>
              <div>
                <label className="block text-xs font-bold text-slate-600 mb-1">Target Section</label>
                <select disabled={isGraduationMode} value={targetSection} onChange={e => setTargetSection(e.target.value)} className="w-full px-3.5 py-2 text-sm rounded-xl border border-slate-200 bg-white disabled:bg-slate-100">
                  {DEFAULT_SECTIONS.map(s => <option key={s} value={s}>Section {s}</option>)}
                </select>
              </div>
              <div>
                <label className="block text-xs font-bold text-slate-600 mb-1">Target Year</label>
                <select value={targetYear} onChange={e => setTargetYear(e.target.value)} className="w-full px-3.5 py-2 text-sm rounded-xl border border-slate-200 bg-white font-semibold">
                  {academicYears.map(y => <option key={y} value={y}>{y}</option>)}
                </select>
              </div>
            </div>
          </div>

          <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
            <div className="p-5 border-b border-slate-100 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
              <div>
                <h4 className="font-bold text-slate-800 text-sm">Students in {sourceClass} - Section {sourceSection} ({sourceStudents.length})</h4>
                <p className="text-xs text-slate-500 mt-0.5">Select students to {isGraduationMode ? 'graduate' : `promote to ${targetClass}`}</p>
              </div>
              <div className="flex items-center gap-3">
                <button onClick={toggleSelectAll} className="px-3 py-1.5 text-xs font-semibold text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-lg">
                  {selectedStudentIds.length === sourceStudents.length ? 'Deselect All' : 'Select All'}
                </button>
                <button onClick={handleExecutePromotion} disabled={selectedStudentIds.length === 0}
                  className="bg-amber-600 hover:bg-amber-500 disabled:opacity-50 text-white font-bold px-5 py-2 rounded-xl text-sm shadow">
                  Promote ({selectedStudentIds.length}) Students
                </button>
              </div>
            </div>
            {sourceStudents.length === 0 ? (
              <div className="p-12 text-center text-slate-400">No active students found in this class/section.</div>
            ) : (
              <div className="overflow-x-auto">
                <table className="w-full text-left text-sm">
                  <thead>
                    <tr className="bg-slate-50 text-slate-600 font-semibold uppercase tracking-wider border-b">
                      <th className="p-3.5 text-center w-12">Select</th>
                      <th className="p-3.5">Roll No</th>
                      <th className="p-3.5">Student Name</th>
                      <th className="p-3.5">Father Name</th>
                      <th className="p-3.5 text-center">Final Score %</th>
                      <th className="p-3.5 text-center">Status</th>
                      <th className="p-3.5 text-right">Destination</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100">
                    {sourceStudents.map(student => {
                      const perf = getStudentPerformance(student.id);
                      const isSelected = selectedStudentIds.includes(student.id);
                      return (
                        <tr key={student.id} className="hover:bg-slate-50">
                          <td className="p-3.5 text-center">
                            <input type="checkbox" checked={isSelected} onChange={() => toggleSelectStudent(student.id)} className="w-4 h-4 rounded" />
                          </td>
                          <td className="p-3.5 font-bold">#{student.rollNo}</td>
                          <td className="p-3.5 font-medium">{student.name}</td>
                          <td className="p-3.5 text-slate-600">{student.fatherName}</td>
                          <td className="p-3.5 text-center font-semibold">{perf.percentage}%</td>
                          <td className="p-3.5 text-center">
                            <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${perf.pass ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}`}>
                              {perf.status}
                            </span>
                          </td>
                          <td className="p-3.5 text-right text-xs font-medium text-teal-700">
                            {isGraduationMode ? 'Graduated' : `${targetClass} (${targetSection})`}
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            )}
          </div>
        </div>
      );
    }

    // ============== DASHBOARD ==============
    function DashboardView({ students, results, classList, currentAcademicYear, setActiveTab }) {
      const activeStudents = students.filter(s => s.status !== 'Graduated');
      return (
        <div className="space-y-6">
          <div className="bg-gradient-to-r from-slate-900 via-indigo-950 to-slate-900 text-white rounded-2xl p-6 sm:p-8 shadow-xl">
            <span className="bg-teal-500/20 text-teal-300 text-xs font-semibold px-3 py-1 rounded-full uppercase">Operational Overview ({currentAcademicYear})</span>
            <h2 className="text-2xl sm:text-3xl font-bold mt-3">School Examination & Parent Information Hub</h2>
            <div className="mt-6 flex flex-wrap gap-3">
              <button onClick={() => setActiveTab('promotion')} className="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-4 py-2 rounded-xl text-sm shadow">Batch Promote Students</button>
              <button onClick={() => setActiveTab('parent-portal')} className="bg-teal-500 hover:bg-teal-400 text-slate-950 font-semibold px-4 py-2 rounded-xl text-sm shadow">Go to Parent Portal</button>
            </div>
          </div>
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <StatCard label="Active Enrolled" value={activeStudents.length} />
            <StatCard label="Total Marksheets" value={Object.keys(results).length} />
            <StatCard label="Configured Classes" value={classList.length} />
            <StatCard label="Active Session" value={currentAcademicYear} />
          </div>
        </div>
      );
    }

    function StatCard({ label, value }) {
      return (
        <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
          <p className="text-xs font-medium text-slate-500 uppercase tracking-wider">{label}</p>
          <h3 className="text-2xl font-bold text-slate-800 mt-1">{value}</h3>
        </div>
      );
    }

    // ============== STUDENT REGISTRATION ==============
    function StudentRegistrationView({ students, setStudents, classList, showToast }) {
      const [formData, setFormData] = useState({ rollNo: '', name: '', fatherName: '', className: 'Class 10', section: 'A', contact: '', attendance: '95%' });
      const [editingId, setEditingId] = useState(null);

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!formData.name || !formData.rollNo || !formData.fatherName) {
          showToast('Please fill required fields!', 'error');
          return;
        }
        if (editingId) {
          setStudents(prev => prev.map(s => s.id === editingId ? { ...s, ...formData } : s));
          showToast('Student updated!');
          setEditingId(null);
        } else {
          const newStudent = { ...formData, id: `STU-${Date.now().toString().slice(-4)}`, status: 'Active', academicHistory: [] };
          setStudents(prev => [newStudent, ...prev]);
          showToast('New student registered!');
        }
        setFormData({ rollNo: '', name: '', fatherName: '', className: 'Class 10', section: 'A', contact: '', attendance: '95%' });
      };

      return (
        <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
          <div className="lg:col-span-5">
            <div className="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm sticky top-24">
              <h3 className="font-bold text-lg text-slate-800 mb-4">{editingId ? 'Edit Student' : 'Register New Student'}</h3>
              <form onSubmit={handleSubmit} className="space-y-4">
                <div>
                  <label className="block text-xs font-semibold text-slate-600 mb-1">Student Full Name *</label>
                  <input type="text" required value={formData.name} onChange={e => setFormData({ ...formData, name: e.target.value })}
                    className="w-full px-3.5 py-2 text-sm rounded-xl border border-slate-200" />
                </div>
                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className="block text-xs font-semibold text-slate-600 mb-1">Roll Number *</label>
                    <input type="text" required value={formData.rollNo} onChange={e => setFormData({ ...formData, rollNo: e.target.value })}
                      className="w-full px-3.5 py-2 text-sm rounded-xl border border-slate-200" />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-slate-600 mb-1">Class *</label>
                    <select value={formData.className} onChange={e => setFormData({ ...formData, className: e.target.value })}
                      className="w-full px-3.5 py-2 text-sm rounded-xl border border-slate-200 bg-white">
                      {classList.map(c => <option key={c} value={c}>{c}</option>)}
                    </select>
                  </div>
                </div>
                <div className="grid grid-cols-2 gap-3">

    // ============== TEACHER MARKS UPLOAD ==============
    function TeacherResultUploadView({ students, results, setResults, classList, currentAcademicYear, academicYears, getSubjectsForClass, showToast, calculateGrade }) {
      const [selectedYear, setSelectedYear] = useState(currentAcademicYear);
      const [selectedClass, setSelectedClass] = useState('Class 10');
      const [selectedSection, setSelectedSection] = useState('A');
      const [selectedTerm, setSelectedTerm] = useState('Final Exam');
      const classSubjects = getSubjectsForClass(selectedClass);
      const roster = students.filter(s => s.className === selectedClass && s.section === selectedSection && s.status !== 'Graduated');
      const [marksState, setMarksState] = useState({});
      const [remarksState, setRemarksState] = useState({});

      useEffect(() => {
        const initialMarks = {};
        const initialRemarks = {};
        roster.forEach(student => {
          const key = `${student.id}_${selectedYear}_${selectedTerm}`;
          const existing = results[key];
          initialMarks[student.id] = {};
          classSubjects.forEach(sub => {
            initialMarks[student.id][sub] = existing && existing[sub] !== undefined ? existing[sub] : '';
          });
          initialRemarks[student.id] = existing ? existing.remarks || '' : '';
        });
        setMarksState(initialMarks);
        setRemarksState(initialRemarks);
      }, [selectedClass, selectedSection, selectedYear, selectedTerm, students]);

      const handleMarkChange = (studentId, subject, val) => {
        let numVal = val === '' ? '' : Math.min(100, Math.max(0, Number(val)));
        setMarksState(prev => ({ ...prev, [studentId]: { ...prev[studentId], [subject]: numVal } }));
      };

      const handleSaveMarks = () => {
        const updated = { ...results };
        roster.forEach(student => {
          const key = `${student.id}_${selectedYear}_${selectedTerm}`;
          updated[key] = { ...marksState[student.id], remarks: remarksState[student.id] || '' };
        });
        setResults(updated);
        showToast(`Results saved for ${selectedClass} (${selectedYear} - ${selectedTerm})!`);
      };

      return (
        <div className="space-y-6">
          <div className="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm">
            <h3 className="font-bold text-slate-800 mb-4 text-base">Teacher Portal: Subject Marks Entry</h3>
            <div className="grid grid-cols-1 sm:grid-cols-4 gap-4">
              <div>
                <label className="block text-xs font-semibold text-slate-600 mb-1">Academic Session</label>
                <select value={selectedYear} onChange={e => setSelectedYear(e.target.value)} className="w-full px-3.5 py-2 text-sm rounded-xl border border-slate-200 bg-white font-semibold text-teal-700">
                  {academicYears.map(y => <option key={y} value={y}>{y}</option>)}
                </select>
              </div>
              <div>
                <label className="block text-xs font-semibold text-slate-600 mb-1">Class</label>
                <select value={selectedClass} onChange={e => setSelectedClass(e.target.value)} className="w-full px-3.5 py-2 text-sm rounded-xl border border-slate-200 bg-white">
                  {classList.map(c => <option key={c} value={c}>{c}</option>)}
                </select>
              </div>
              <div>
                <label className="block text-xs font-semibold text-slate-600 mb-1">Section</label>
                <select value={selectedSection} onChange={e => setSelectedSection(e.target.value)} className="w-full px-3.5 py-2 text-sm rounded-xl border border-slate-200 bg-white">
                  {DEFAULT_SECTIONS.map(s => <option key={s} value={s}>Section {s}</option>)}
                </select>
              </div>
              <div>
                <label className="block text-xs font-semibold text-slate-600 mb-1">Examination Term</label>
                <select value={selectedTerm} onChange={e => setSelectedTerm(e.target.value)} className="w-full px-3.5 py-2 text-sm rounded-xl border border-slate-200 bg-white">
                  {DEFAULT_TERMS.map(t => <option key={t} value={t}>{t}</option>)}
                </select>
              </div>
            </div>
          </div>

          <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
            <div className="p-5 border-b border-slate-100 flex items-center justify-between flex-wrap gap-3">
              <div>
                <h4 className="font-bold text-slate-800">Roster Marks Sheet ({selectedClass} - {selectedSection})</h4>
                <p className="text-xs text-slate-500 mt-0.5">Session: {selectedYear} | Term: {selectedTerm}</p>
              </div>
              <button onClick={handleSaveMarks} disabled={roster.length === 0}
                className="bg-teal-600 hover:bg-teal-500 disabled:opacity-50 text-white font-semibold px-4 py-2 rounded-xl text-sm shadow">
                Save All Marks
              </button>
            </div>
            {roster.length === 0 ? (
              <div className="p-12 text-center text-slate-400">No students in this class/section.</div>
            ) : (
              <div className="overflow-x-auto">
                <table className="w-full text-left text-sm">
                  <thead>
                    <tr className="bg-slate-50 text-slate-600 font-semibold uppercase tracking-wider border-b">
                      <th className="p-3 sticky left-0 bg-slate-50 z-10">Student</th>
                      {classSubjects.map(subj => <th key={subj} className="p-3 text-center min-w-[80px]">{subj}</th>)}
                      <th className="p-3 text-center">Total / %</th>
                      <th className="p-3 text-center">Grade</th>
                      <th className="p-3 min-w-[160px]">Feedback</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100">
                    {roster.map(student => {
                      const marks = marksState[student.id] || {};
                      let total = 0, filled = 0;
                      classSubjects.forEach(s => {
                        if (marks[s] !== '' && marks[s] !== undefined) { total += Number(marks[s]); filled++; }
                      });
                      const perc = filled > 0 ? ((total / (classSubjects.length * 100)) * 100).toFixed(1) : 0;
                      const g = calculateGrade(perc);
                      return (
                        <tr key={student.id} className="hover:bg-slate-50">
                          <td className="p-3 sticky left-0 bg-white z-10 border-r">
                            <div className="font-bold">#{student.rollNo}</div>
                            <div className="text-xs font-medium">{student.name}</div>
                          </td>
                          {classSubjects.map(subj => (
                            <td key={subj} className="p-2 text-center">
                              <input type="number" min="0" max="100" placeholder="0-100"
                                value={marks[subj] !== undefined ? marks[subj] : ''}
                                onChange={e => handleMarkChange(student.id, subj, e.target.value)}
                                className="w-14 px-1.5 py-1.5 text-center text-xs font-semibold rounded-lg border border-slate-200" />
                            </td>
                          ))}
                          <td className="p-3 text-center font-semibold">
                            <div>{total} / {classSubjects.length * 100}</div>
                            <div className="text-xs text-slate-400">{perc}%</div>
                          </td>
                          <td className="p-3 text-center">
                            <span className={`px-2.5 py-1 rounded-md text-xs font-bold ${g.badge}`}>{g.grade}</span>
                          </td>
                          <td className="p-2">
                            <input type="text" placeholder="Teacher feedback..."
                              value={remarksState[student.id] || ''}
                              onChange={e => setRemarksState(prev => ({ ...prev, [student.id]: e.target.value }))}
                              className="w-full px-2.5 py-1.5 text-xs rounded-lg border border-slate-200" />
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            )}
          </div>
        </div>
      );
    }

    // ============== RESULT LOOKUP PRINT ==============
    function ResultLookupPrintView({ students, results, academicYears, currentAcademicYear, getSubjectsForClass, calculateGrade, calculateClassRank, schoolInfo }) {
      const [searchQuery, setSearchQuery] = useState('101');
      const [selectedYear, setSelectedYear] = useState(currentAcademicYear);
      const [selectedTerm, setSelectedTerm] = useState('Final Exam');
      const [selectedStudent, setSelectedStudent] = useState(null);

      useEffect(() => {
        if (!searchQuery.trim()) { setSelectedStudent(null); return; }
        const match = students.find(s =>
          s.rollNo.trim().toLowerCase() === searchQuery.trim().toLowerCase() ||
          s.name.toLowerCase().includes(searchQuery.trim().toLowerCase())
        );
        setSelectedStudent(match || null);
      }, [searchQuery, students]);

      const classSubjects = selectedStudent ? getSubjectsForClass(selectedStudent.className) : [];
      const key = selectedStudent ? `${selectedStudent.id}_${selectedYear}_${selectedTerm}` : '';
      const currentResult = selectedStudent ? results[key] : null;
      let totalObtained = 0;
      const totalPossible = classSubjects.length * 100;
      if (currentResult) classSubjects.forEach(sub => { if (currentResult[sub] !== undefined) totalObtained += Number(currentResult[sub]); });
      const overallPercentage = totalPossible > 0 ? ((totalObtained / totalPossible) * 100).toFixed(1) : 0;
      const overallGrade = calculateGrade(overallPercentage);
      const rankInfo = selectedStudent ? calculateClassRank(selectedStudent.id, selectedStudent.className, selectedYear, selectedTerm) : { rank: 'N/A', totalClass: 0 };

      return (
        <div className="space-y-6">
          <div className="print:hidden bg-white p-6 rounded-2xl border border-slate-200 shadow-sm max-w-2xl mx-auto space-y-4">
            <h3 className="font-bold text-slate-800 text-center text-lg">Print Official Marksheet Card</h3>
            <div className="grid grid-cols-1 sm:grid-cols-12 gap-3">
              <div className="sm:col-span-6">
                <input type="text" placeholder="Roll No or Name..." value={searchQuery}
                  onChange={e => setSearchQuery(e.target.value)}
                  className="w-full px-4 py-2.5 text-sm rounded-xl border border-slate-200" />
              </div>
              <div className="sm:col-span-3">
                <select value={selectedYear} onChange={e => setSelectedYear(e.target.value)} className="w-full px-3 py-2.5 text-xs rounded-xl border border-slate-200 font-semibold">
                  {academicYears.map(y => <option key={y} value={y}>{y}</option>)}
                </select>
              </div>
              <div className="sm:col-span-3">
                <select value={selectedTerm} onChange={e => setSelectedTerm(e.target.value)} className="w-full px-3 py-2.5 text-xs rounded-xl border border-slate-200">
                  {DEFAULT_TERMS.map(t => <option key={t} value={t}>{t}</option>)}
                </select>
              </div>
            </div>
          </div>

          {selectedStudent ? (
            <div className="max-w-3xl mx-auto">
              <div className="print:hidden mb-4 flex justify-between items-center">
                <span className="text-xs text-slate-500 font-medium">Official Examination Card Preview</span>
                <button onClick={() => window.print()}
                  className="bg-slate-900 hover:bg-slate-800 text-white font-semibold px-4 py-2 rounded-xl text-sm shadow">
                  Print Result Card
                </button>
              </div>
              <div className="bg-white rounded-2xl border border-slate-300 p-6 sm:p-10 shadow-lg print:shadow-none print:border-2 print:border-emerald-800 print-card">
                <div className="border-b-2 border-slate-900 pb-6 mb-6 text-center sm:text-left">
                  <h2 className="text-2xl font-black uppercase text-slate-900">{schoolInfo.name}</h2>
                  <p className="text-sm font-urdu text-emerald-800 font-bold">{schoolInfo.urduName}</p>
                  <p className="text-xs font-semibold text-slate-600 uppercase mt-1">Annual Examination Board & Progress Report Card</p>
                  <p className="text-xs text-slate-400">Session {selectedYear} • Founder: {schoolInfo.ownerName}</p>
                </div>
                <div className="bg-slate-50 border border-slate-200 rounded-xl p-4 mb-6 grid grid-cols-2 sm:grid-cols-4 gap-4 text-sm">
                  <div><span className="text-slate-400 block text-xs uppercase">Student Name</span><span className="font-bold">{selectedStudent.name}</span></div>
                  <div><span className="text-slate-400 block text-xs uppercase">Roll Number</span><span className="font-bold">#{selectedStudent.rollNo}</span></div>
                  <div><span className="text-slate-400 block text-xs uppercase">Class & Section</span><span className="font-bold">{selectedStudent.className} ({selectedStudent.section})</span></div>
                  <div><span className="text-slate-400 block text-xs uppercase">Father Name</span><span className="font-bold">{selectedStudent.fatherName}</span></div>
                </div>
                {currentResult ? (
                  <div className="space-y-6">
                    <table className="w-full border-collapse text-left text-sm">
                      <thead>
                        <tr className="bg-slate-900 text-white font-semibold">
                          <th className="p-3 rounded-tl-lg">Subject</th>
                          <th className="p-3 text-center">Max</th>
                          <th className="p-3 text-center">Obtained</th>
                          <th className="p-3 text-center">Grade</th>
                          <th className="p-3 text-center rounded-tr-lg">Status</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-200">
                        {classSubjects.map((subject, idx) => {
                          const marks = currentResult[subject] !== undefined ? currentResult[subject] : '-';
                          const perc = currentResult[subject] !== undefined ? currentResult[subject] : 0;
                          const g = calculateGrade(perc);
                          const pass = perc >= 40;
                          return (
                            <tr key={subject} className={idx % 2 === 0 ? 'bg-white' : 'bg-slate-50/50'}>
                              <td className="p-3 font-semibold">{subject}</td>
                              <td className="p-3 text-center text-slate-500">100</td>
                              <td className="p-3 text-center font-bold">{marks}</td>

                      <div><span className="text-xs text-slate-500 uppercase block">Percentage</span><span className="text-lg font-bold">{overallPercentage}%</span></div>
                      <div><span className="text-xs text-slate-500 uppercase block">Overall Grade</span>
                        <span className={`text-lg font-black ${overallGrade.color}`}>{overallGrade.grade} ({Number(overallPercentage) >= 40 ? 'Promoted' : 'Needs Improvement'})</span>
                      </div>
                    </div>
                    <div className="pt-10 grid grid-cols-3 gap-4 text-center text-xs text-slate-500 font-medium">
                      <div className="border-t border-slate-400 pt-2">Class Teacher</div>
                      <div className="border-t border-slate-400 pt-2">Exam Controller</div>
                      <div className="border-t border-slate-400 pt-2">Principal</div>
                    </div>
                  </div>
                ) : (
                  <div className="p-8 text-center bg-amber-50 border border-amber-200 rounded-xl text-amber-800 text-sm">
                    Marksheet for <strong>{selectedTerm} ({selectedYear})</strong> has not been uploaded yet.
                  </div>
                )}
              </div>
            </div>
          ) : (
            <div className="bg-white p-12 text-center rounded-2xl border border-slate-200 max-w-2xl mx-auto text-slate-400">
              <p className="font-semibold text-slate-600">No Student Found</p>
            </div>
          )}
        </div>
      );
    }

    // ============== SETTINGS ==============
    function SystemSettingsView({ currentAcademicYear, setCurrentAcademicYear, academicYears, setAcademicYears, classList, setClassList, subjectsConfig, setSubjectsConfig, handleExportData, handleImportData, handleResetDemo, showToast }) {
      const [newYear, setNewYear] = useState('');
      const [newClass, setNewClass] = useState('');
      const [selectedConfigClass, setSelectedConfigClass] = useState('Class 10');
      const [newSubject, setNewSubject] = useState('');

      const handleAddYear = (e) => {
        e.preventDefault();
        if (!newYear.trim()) return;
        if (academicYears.includes(newYear.trim())) { showToast('Year already exists!', 'error'); return; }
        setAcademicYears([...academicYears, newYear.trim()]);
        setNewYear('');
        showToast('New Academic Session added!');
      };

      const handleAddClass = (e) => {
        e.preventDefault();
        if (!newClass.trim()) return;
        if (classList.includes(newClass.trim())) { showToast('Class already exists!', 'error'); return; }
        setClassList([...classList, newClass.trim()]);
        setNewClass('');
        showToast('New Class added!');
      };

      const handleAddSubject = (e) => {
        e.preventDefault();
        if (!newSubject.trim()) return;
        const current = subjectsConfig[selectedConfigClass] || subjectsConfig['Default'] || [];
        if (current.includes(newSubject.trim())) { showToast('Subject already exists!', 'error'); return; }
        setSubjectsConfig({ ...subjectsConfig, [selectedConfigClass]: [...current, newSubject.trim()] });
        setNewSubject('');
        showToast(`Added ${newSubject} to ${selectedConfigClass}!`);
      };

      const handleRemoveSubject = (sub) => {
        const current = subjectsConfig[selectedConfigClass] || subjectsConfig['Default'] || [];
        setSubjectsConfig({ ...subjectsConfig, [selectedConfigClass]: current.filter(s => s !== sub) });
        showToast(`Removed ${sub}`);
      };

      return (
        <div className="space-y-6">
          <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
            <div>
              <h3 className="font-bold text-slate-800 text-lg">Dynamic Portal Settings & Master Configuration</h3>
              <p className="text-xs text-slate-500 mt-1">Configure classes, subjects, academic sessions, and export backups.</p>
            </div>
            <div className="flex items-center gap-2 flex-wrap">
              <button onClick={handleExportData} className="bg-slate-900 hover:bg-slate-800 text-white font-medium px-4 py-2 rounded-xl text-xs shadow">Export JSON Backup</button>
              <label className="bg-teal-600 hover:bg-teal-500 text-white font-medium px-4 py-2 rounded-xl text-xs shadow cursor-pointer">
                Import Backup
                <input type="file" accept=".json" onChange={handleImportData} className="hidden" />
              </label>
              <button onClick={handleResetDemo} className="bg-rose-50 text-rose-700 hover:bg-rose-100 font-medium px-3 py-2 rounded-xl text-xs border border-rose-200">Reset Demo</button>
            </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-4">
              <h4 className="font-bold text-slate-800 text-sm">Academic Years & Active Session</h4>
              <div>
                <label className="block text-xs text-slate-500 mb-1">Set Active School Session</label>
                <select value={currentAcademicYear} onChange={e => setCurrentAcademicYear(e.target.value)}
                  className="w-full px-3 py-2 text-sm rounded-xl border border-slate-200 font-bold text-teal-700">
                  {academicYears.map(y => <option key={y} value={y}>Session {y}</option>)}
                </select>
              </div>
              <form onSubmit={handleAddYear} className="flex gap-2">
                <input type="text" placeholder="e.g. 2027-2028" value={newYear} onChange={e => setNewYear(e.target.value)}
                  className="flex-grow px-3 py-2 text-xs rounded-xl border border-slate-200" />
                <button type="submit" className="bg-slate-900 text-white text-xs px-4 py-2 rounded-xl font-semibold">+ Add Session</button>
              </form>
            </div>
            <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-4">
              <h4 className="font-bold text-slate-800 text-sm">Classes Management</h4>
              <div className="flex flex-wrap gap-1.5">
                {classList.map(c => <span key={c} className="bg-slate-100 text-slate-700 px-2.5 py-1 rounded-lg text-xs font-semibold">{c}</span>)}
              </div>
              <form onSubmit={handleAddClass} className="flex gap-2">
                <input type="text" placeholder="e.g. Class 11" value={newClass} onChange={e => setNewClass(e.target.value)}
                  className="flex-grow px-3 py-2 text-xs rounded-xl border border-slate-200" />
                <button type="submit" className="bg-slate-900 text-white text-xs px-4 py-2 rounded-xl font-semibold">+ Add Class</button>
              </form>
            </div>
          </div>

          <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
            <h4 className="font-bold text-slate-800 text-sm">Dynamic Subject Allocation per Class</h4>
            <div className="max-w-xs">
              <label className="block text-xs text-slate-500 mb-1">Select Class to Configure</label>
              <select value={selectedConfigClass} onChange={e => setSelectedConfigClass(e.target.value)}
                className="w-full px-3 py-2 text-sm rounded-xl border border-slate-200 font-bold">
                {classList.map(c => <option key={c} value={c}>{c}</option>)}
              </select>
            </div>
            <div className="flex flex-wrap gap-2 pt-2">
              {(subjectsConfig[selectedConfigClass] || subjectsConfig['Default'] || []).map(sub => (
                <span key={sub} className="bg-teal-50 border border-teal-200 text-teal-800 px-3 py-1.5 rounded-xl text-xs font-bold flex items-center gap-2">
                  {sub}
                  <button onClick={() => handleRemoveSubject(sub)} className="text-teal-600 hover:text-rose-600">×</button>
                </span>
              ))}
            </div>
            <form onSubmit={handleAddSubject} className="flex gap-2 max-w-md pt-2">
              <input type="text" placeholder="New subject (e.g. Physics, Sindhi)..." value={newSubject}
                onChange={e => setNewSubject(e.target.value)} className="flex-grow px-3 py-2 text-xs rounded-xl border border-slate-200" />
              <button type="submit" className="bg-teal-600 text-white text-xs px-4 py-2 rounded-xl font-semibold">+ Add Subject</button>
            </form>
          </div>
        </div>
      );
    }

    // ============== RENDER ==============
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
